<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Αποθήκη">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Αποθήκη Σπιτιού</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#1b2420;--mut:#6b7872;--pri:#1f7a5c;--pri-t:#fff;--line:#e3e7e4;--red:#c0392b;--amb:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#111815;--card:#1a2420;--tx:#eaf0ed;--mut:#93a39b;--pri:#34a77f;--pri-t:#06130e;--line:#26332d;--red:#ef6a5b;--amb:#e0a73a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--pri);color:var(--pri-t);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:18px;z-index:5}
main{padding:12px 12px 150px;max-width:640px;margin:0 auto}
h4{margin:18px 4px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools input{flex:1.4;min-width:0}.tools select{flex:1;min-width:0}
input,select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}
label input,label select{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.info{flex:1;min-width:0}.info b{display:block;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mut);font-size:14px}
.btns{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:24px;line-height:1}
.rb.add{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.b{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:4px}
.b.out{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.b.low{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
.q{font-weight:700;white-space:nowrap}.q.in{color:var(--pri)}.q.out{color:var(--red)}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:8px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav .i{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-style:normal;border-radius:999px;padding:0 6px;min-width:16px}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-t);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:6}
#sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheetwrap.open{display:flex}
.card{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.card h3{margin:0 0 6px}
.big{font-size:34px;font-weight:700}.big span{font-size:16px;font-weight:400;color:var(--mut)}
.meta{color:var(--mut);font-size:14px;margin:4px 0 8px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button,.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.actions .primary,.btn.primary{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.actions .danger,.btn.danger{color:var(--red)}
.btn{display:block;width:100%;margin-top:8px}
.hl{font-size:14px;color:var(--mut);padding:3px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}
.catrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 14px;margin-bottom:6px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;gap:10px;z-index:20}
#toast.show{display:flex}
#toast button{background:none;border:0;color:#7ee0b8;font:inherit;font-weight:700}
</style>
</head>
<body>
<header>📦 Αποθήκη Σπιτιού</header>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="Νέο είδος">+</button>
<nav>
  <button data-act="tab" data-v="stock"><span class="i">📦</span>Απόθεμα</button>
  <button data-act="tab" data-v="shop"><span class="i">🛒</span>Ψώνια<i class="dot" id="dot" style="display:none"></i></button>
  <button data-act="tab" data-v="hist"><span class="i">🕘</span>Ιστορικό</button>
  <button data-act="tab" data-v="set"><span class="i">⚙️</span>Ρυθμίσεις</button>
</nav>
<div id="sheetwrap"><div id="sheet" style="width:100%;display:flex;justify-content:center"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
const DEFAULT_CATS=['Χαρτικά','Απορρυπαντικά','Προσωπική υγιεινή','Γαλακτοκομικά','Σνακ','Ξηρά τρόφιμα','Κατεψυγμένα','Φρούτα & Λαχανικά','Ποτά','Άλλο'];
const UNITS=['τεμ.','πακέτο','συσκ.','ρολά','kg','gr','lt','ml'];
const COUNT_UNITS=['τεμ.','πακέτο','συσκ.','ρολά'];
const EXP_DAYS=7;
const KEY='apothiki_v1';
const STARTER=[
['Χαρτί υγείας','Χαρτικά','ρολά',8],['Χαρτί κουζίνας','Χαρτικά','ρολά',2],['Χαρτομάντιλα','Χαρτικά','πακέτο',2],
['Απορρυπαντικό πλυντηρίου ρούχων','Απορρυπαντικά','συσκ.',1],['Μαλακτικό','Απορρυπαντικά','συσκ.',1],['Υγρό πιάτων','Απορρυπαντικά','τεμ.',1],
['Ταμπλέτες πλυντηρίου πιάτων','Απορρυπαντικά','συσκ.',1],['Χλωρίνη','Απορρυπαντικά','τεμ.',1],['Καθαριστικό τζαμιών','Απορρυπαντικά','τεμ.',1],
['Σαμπουάν','Προσωπική υγιεινή','τεμ.',1],['Αφρόλουτρο','Προσωπική υγιεινή','τεμ.',1],['Οδοντόκρεμα','Προσωπική υγιεινή','τεμ.',1],['Σαπούνι','Προσωπική υγιεινή','τεμ.',2],
['Γάλα','Γαλακτοκομικά','τεμ.',2],['Γιαούρτι','Γαλακτοκομικά','τεμ.',4],['Τυρί σε φέτες','Γαλακτοκομικά','πακέτο',1],['Βούτυρο','Γαλακτοκομικά','τεμ.',1],['Αυγά','Γαλακτοκομικά','πακέτο',1],
['Μπισκότα','Σνακ','πακέτο',2],['Πατατάκια','Σνακ','πακέτο',1],['Μπάρες δημητριακών','Σνακ','πακέτο',1],['Ξηροί καρποί','Σνακ','πακέτο',1],
['Ρύζι','Ξηρά τρόφιμα','kg',1],['Μακαρόνια','Ξηρά τρόφιμα','πακέτο',3],['Αλεύρι','Ξηρά τρόφιμα','kg',1],['Ζάχαρη','Ξηρά τρόφιμα','kg',1],['Καφές','Ξηρά τρόφιμα','πακέτο',1],['Ελαιόλαδο','Ξηρά τρόφιμα','lt',1],['Τόνος κονσέρβα','Ξηρά τρόφιμα','τεμ.',2]
];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const parseNum=v=>parseFloat(String(v).replace(',','.'));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const localISO=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(localISO()+'T00:00:00'))/864e5);
const fmtDate=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fmtDT=s=>new Date(s).toLocaleString('el-GR',{dateStyle:'short',timeStyle:'short'});

function blank(){return{items:[],tx:[],cats:[...DEFAULT_CATS]}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.items)&&Array.isArray(d.tx)){d.cats=Array.isArray(d.cats)&&d.cats.length?d.cats:[...DEFAULT_CATS];return d}
  }catch(e){}
  return blank();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Αποτυχία αποθήκευσης!')}}
const ui={tab:'stock',q:'',f:'all',cat:''};
const item=id=>S.items.find(i=>i.id===id);

/* ---------- Υπολογισμοί ---------- */
function stockOf(id){let s=0;for(const t of S.tx)if(t.itemId===id)s+=t.type==='in'?t.qty:-t.qty;return Math.round(s*1000)/1000}
function nextExpiry(id){
  const ins=S.tx.filter(t=>t.itemId===id&&t.type==='in').map(t=>({q:t.qty,e:t.expiry||''}));
  let out=S.tx.filter(t=>t.itemId===id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
  ins.sort((a,b)=>{const x=a.e||'9999',y=b.e||'9999';return x<y?-1:x>y?1:0});
  for(const b of ins){const u=Math.min(b.q,out);b.q-=u;out-=u}
  const left=ins.filter(b=>b.q>0.001&&b.e);
  return left.length?left[0].e:null;
}
function info(i){
  const st=stockOf(i.id),ex=st>0?nextExpiry(i.id):null,d=ex?daysTo(ex):null;
  return Object.assign({},i,{st,ex,d,low:i.min>0&&st<=i.min,soon:d!==null&&d<=EXP_DAYS});
}
function shopItems(){
  return S.items.map(info).filter(i=>i.min>0&&i.st<=i.min).map(i=>{
    let need=i.min*2-i.st;need=COUNT_UNITS.includes(i.unit)?Math.ceil(need):Math.round(need*100)/100;
    return Object.assign(i,{need});
  });
}

/* ---------- Προβολές ---------- */
function render(){
  const v=$('#main');
  v.innerHTML=ui.tab==='stock'?viewStock():ui.tab==='shop'?viewShop():ui.tab==='hist'?viewHist():viewSet();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab));
  $('#fab').style.display=ui.tab==='stock'?'flex':'none';
  const n=shopItems().length,dot=$('#dot');dot.textContent=n;dot.style.display=n?'':'none';
  window.scrollTo(0,0);
}
function viewStock(){
  const cats='<option value="">Όλες οι κατηγορίες</option>'+S.cats.map(c=>`<option ${ui.cat===c?'selected':''}>${esc(c)}</option>`).join('');
  const chips=[['all','Όλα'],['low','Χαμηλό απόθεμα'],['exp','Λήγουν σύντομα']].map(([k,l])=>`<button class="chip ${ui.f===k?'on':''}" data-act="filter" data-v="${k}">${l}</button>`).join('');
  return `<div class="tools"><input id="q" type="search" placeholder="Αναζήτηση…" value="${esc(ui.q)}"><select id="catsel">${cats}</select></div><div class="chips">${chips}</div><div id="list">${listStock()}</div>`;
}
function listStock(){
  if(!S.items.length)return '<div class="empty">Δεν υπάρχουν είδη ακόμα.<br>Πάτα το <b>+</b> για να προσθέσεις το πρώτο ή φόρτωσε βασικά είδη από τις Ρυθμίσεις.</div>';
  const q=ui.q.trim().toLowerCase();
  const a=S.items.map(info).filter(i=>(!q||i.name.toLowerCase().includes(q)||(i.barcode||'').includes(q))&&(!ui.cat||i.cat===ui.cat)&&(ui.f==='all'||(ui.f==='low'&&i.low)||(ui.f==='exp'&&i.soon)));
  if(!a.length)return '<div class="empty">Κανένα αποτέλεσμα.</div>';
  const groups={};
  a.forEach(i=>{const c=S.cats.includes(i.cat)?i.cat:'Άλλο';(groups[c]=groups[c]||[]).push(i)});
  const order=[...S.cats,'Άλλο'].filter((c,k,arr)=>arr.indexOf(c)===k);
  return order.filter(c=>groups[c]).map(c=>`<h4>${esc(c)}</h4>`+groups[c].sort((x,y)=>x.name.localeCompare(y.name,'el')).map(row).join('')).join('');
}
function row(i){
  let b='';
  if(i.st<=0)b+='<span class="b out">Τέλος</span>';else if(i.low)b+='<span class="b low">Χαμηλό</span>';
  if(i.ex){if(i.d<0)b+='<span class="b out">Έληξε</span>';else if(i.d<=EXP_DAYS)b+=`<span class="b low">${i.d===0?'Λήγει σήμερα':'Λήγει σε '+i.d+' ημ.'}</span>`}
  return `<div class="row" data-act="detail" data-id="${i.id}"><div class="info"><b>${esc(i.name)}</b><small>${fmt(i.st)} ${esc(i.unit)}${b}</small></div><div class="btns"><button class="rb" data-act="out" data-id="${i.id}" aria-label="Κατανάλωση">−</button><button class="rb add" data-act="in" data-id="${i.id}" aria-label="Εισαγωγή">+</button></div></div>`;
}
function viewShop(){
  const a=shopItems();
  if(!a.length)return '<div class="empty">Όλα καλά! Δεν λείπει τίποτα 🎉<br><small>Ορίστε «ελάχιστο όριο» στα είδη για να εμφανίζονται εδώ όταν λιγοστεύουν.</small></div>';
  return `<button class="btn primary" data-act="sharelist" style="margin:0 0 10px">Κοινοποίηση / αντιγραφή λίστας</button>`+
    a.sort((x,y)=>x.cat.localeCompare(y.cat,'el')||x.name.localeCompare(y.name,'el')).map(i=>
    `<div class="row"><div class="info"><b>${esc(i.name)}</b><small>Απόθεμα ${fmt(i.st)} / ελάχ. ${fmt(i.min)} ${esc(i.unit)} · πρόταση: ${fmt(i.need)}</small></div><button class="rb add" style="width:auto;padding:0 12px;font-size:14px" data-act="buy" data-id="${i.id}">Αγόρασα</button></div>`).join('');
}
function viewHist(){
  const a=[...S.tx].sort((x,y)=>y.date.localeCompare(x.date)).slice(0,150);
  if(!a.length)return '<div class="empty">Δεν υπάρχουν κινήσεις ακόμα.</div>';
  return a.map(t=>{const it=item(t.itemId);if(!it)return '';
    return `<div class="row"><div class="info"><b>${esc(it.name)}</b><small>${fmtDT(t.date)}${t.expiry?' · λήξη '+fmtDate(t.expiry):''}</small></div><div class="q ${t.type}">${t.type==='in'?'+':'−'}${fmt(t.qty)} ${esc(it.unit)}</div><button class="x" data-act="deltx" data-id="${t.id}" aria-label="Διαγραφή κίνησης">✕</button></div>`}).join('');
}
function viewSet(){
  const used=c=>S.items.some(i=>i.cat===c);
  return `<h4>Αντίγραφο ασφαλείας</h4>
  <p class="meta">Τα δεδομένα αποθηκεύονται μόνο σε αυτή τη συσκευή. Κάνε εξαγωγή αντιγράφου τακτικά, ειδικά πριν αλλάξεις κινητό.</p>
  <button class="btn primary" data-act="export">Εξαγωγή αντιγράφου</button>
  <button class="btn" data-act="import">Εισαγωγή από αντίγραφο</button>
  <h4>Κατηγορίες</h4>
  ${S.cats.map(c=>`<div class="catrow"><span>${esc(c)}</span>${used(c)?'<span class="meta" style="margin:0 8px">σε χρήση</span>':`<button class="x" data-act="delcat" data-v="${esc(c)}" aria-label="Διαγραφή">✕</button>`}</div>`).join('')}
  <div class="tools" style="margin-top:8px"><input id="newcat" placeholder="Νέα κατηγορία"><button class="btn primary" style="width:auto;margin:0;padding:0 16px" data-act="addcat">Προσθήκη</button></div>
  <h4>Βασικά είδη</h4>
  <p class="meta">Προσθέτει έτοιμη λίστα συνηθισμένων ειδών (με απόθεμα 0) ώστε να μη τα γράφεις ένα-ένα. Τα ήδη υπάρχοντα δεν διπλογράφονται.</p>
  <button class="btn" data-act="starter">Φόρτωση βασικών ειδών</button>
  <h4>Επικίνδυνη ζώνη</h4>
  <button class="btn danger" data-act="wipe">Διαγραφή όλων των δεδομένων</button>
  <p class="meta" style="text-align:center;margin-top:24px">Αποθήκη Σπιτιού v1.0</p>`;
}

/* ---------- Φύλλα (modals) ---------- */
function sheet(html){$('#sheet').innerHTML='<div class="card">'+html+'</div>';$('#sheetwrap').classList.add('open')}
function closeSheet(){$('#sheetwrap').classList.remove('open');$('#sheet').innerHTML=''}
function qtySheet(id,type,def){
  const it=item(id);
  sheet(`<h3>${type==='in'?'Εισαγωγή':'Κατανάλωση'}: ${esc(it.name)}</h3>
  <label>Ποσότητα (${esc(it.unit)})<input id="f_qty" type="text" inputmode="decimal" value="${def||1}"></label>
  ${type==='in'?'<label>Ημερομηνία λήξης (προαιρετικά)<input id="f_exp" type="date"></label>':''}
  <div class="actions"><button data-act="close">Άκυρο</button><button class="primary" data-act="saveqty" data-id="${id}" data-v="${type}">Αποθήκευση</button></div>`);
  setTimeout(()=>{const f=$('#f_qty');if(f){f.focus();f.select()}},50);
}
function detailSheet(id){
  const i=info(item(id));
  const hist=S.tx.filter(t=>t.itemId===id).slice(-8).reverse();
  sheet(`<h3>${esc(i.name)}</h3>
  <div class="big">${fmt(i.st)} <span>${esc(i.unit)}</span></div>
  <p class="meta">${esc(i.cat)}${i.min?' · Ελάχιστο: '+fmt(i.min):''}${i.barcode?' · '+esc(i.barcode):''}${i.ex?' · Πλησιέστερη λήξη: '+fmtDate(i.ex):''}</p>
  <div class="actions" style="margin-top:8px"><button data-act="outq" data-id="${id}">− Κατανάλωση</button><button class="primary" data-act="in" data-id="${id}">+ Εισαγωγή</button></div>
  <div class="actions" style="margin-top:8px"><button data-act="edit" data-id="${id}">Επεξεργασία</button><button data-act="close">Κλείσιμο</button></div>
  ${hist.length?'<h4>Τελευταίες κινήσεις</h4>'+hist.map(t=>`<div class="hl">${fmtDT(t.date)} · <b class="q ${t.type}">${t.type==='in'?'+':'−'}${fmt(t.qty)}</b>${t.expiry?' · λήξη '+fmtDate(t.expiry):''}</div>`).join(''):''}`);
}
function itemSheet(id){
  const it=id?item(id):{name:'',cat:ui.cat||S.cats[0],unit:'τεμ.',min:0,barcode:''};
  const catOpts=S.cats.map(c=>`<option ${it.cat===c?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">+ Νέα κατηγορία…</option>';
  const unitOpts=UNITS.map(u=>`<option ${it.unit===u?'selected':''}>${esc(u)}</option>`).join('');
  sheet(`<h3>${id?'Επεξεργασία είδους':'Νέο είδος'}</h3>
  <label>Όνομα<input id="f_name" value="${esc(it.name)}" autocomplete="off"></label>
  <label>Κατηγορία<select id="f_cat">${catOpts}</select></label>
  <input id="f_newcat" placeholder="Όνομα νέας κατηγορίας" style="display:none;margin-top:8px">
  <div class="two"><label>Μονάδα<select id="f_unit">${unitOpts}</select></label><label>Ελάχιστο όριο<input id="f_min" inputmode="decimal" value="${it.min||''}" placeholder="0"></label></div>
  <label>Barcode (προαιρετικά)<input id="f_bar" inputmode="numeric" value="${esc(it.barcode||'')}"></label>
  ${id?'':'<div class="two"><label>Αρχική ποσότητα<input id="f_qty" inputmode="decimal" placeholder="0"></label><label>Λήξη<input id="f_exp" type="date"></label></div>'}
  <div class="actions">${id?`<button class="danger" data-act="delitem" data-id="${id}">Διαγραφή</button>`:''}<button data-act="close">Άκυρο</button><button class="primary" data-act="saveitem" data-id="${id||''}">Αποθήκευση</button></div>`);
  if(!id)setTimeout(()=>{const f=$('#f_name');if(f)f.focus()},50);
}

/* ---------- Ενέργειες ---------- */
function addTx(itemId,type,qty,expiry){
  const t={id:uid(),itemId,type,qty,date:new Date().toISOString()};
  if(expiry)t.expiry=expiry;
  S.tx.push(t);save();render();
  const it=item(itemId);
  toast(`${type==='in'?'+':'−'}${fmt(qty)} ${it.unit} · ${it.name}`,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);save();render()});
}
let tt;
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button id="undo">Αναίρεση</button>':'');
  t.classList.add('show');
  if(undo)$('#undo').onclick=()=>{undo();hideToast()};
  clearTimeout(tt);tt=setTimeout(hideToast,undo?5000:2500);
}
function hideToast(){$('#toast').classList.remove('show')}

function saveItem(id){
  const name=$('#f_name').value.trim();
  if(!name)return toast('Γράψε όνομα');
  let cat=$('#f_cat').value;
  if(cat==='__new'){cat=$('#f_newcat').value.trim();if(!cat)return toast('Γράψε όνομα κατηγορίας');if(!S.cats.includes(cat))S.cats.push(cat)}
  if(S.items.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Υπάρχει ήδη είδος με αυτό το όνομα');
  const unit=$('#f_unit').value,min=parseNum($('#f_min').value)||0,barcode=$('#f_bar').value.trim();
  if(id){Object.assign(item(id),{name,cat,unit,min,barcode});save();closeSheet();render();toast('Αποθηκεύτηκε');return}
  const it={id:uid(),name,cat,unit,min,barcode};
  S.items.push(it);
  const q=parseNum($('#f_qty').value),ex=$('#f_exp').value;
  closeSheet();
  if(q>0)addTx(it.id,'in',q,ex);else{save();render();toast('Το είδος προστέθηκε')}
}
function saveQty(id,type){
  const it=item(id);let q=parseNum($('#f_qty').value);
  if(!(q>0))return toast('Βάλε ποσότητα μεγαλύτερη από 0');
  if(type==='out'){
    const st=stockOf(id);
    if(st<=0)return toast('Δεν υπάρχει απόθεμα');
    if(q>st){q=st;toast('Το απόθεμα ήταν '+fmt(st)+' — καταχωρήθηκε αυτή η ποσότητα')}
  }
  const ex=type==='in'?$('#f_exp').value:'';
  closeSheet();addTx(id,type,q,ex);
}
async function doExport(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const name='apothiki-'+localISO()+'.json';
  try{
    const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Αντίγραφο αποθήκης'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
async function shareList(){
  const txt='Λίστα αγορών\n'+shopItems().map(i=>`- ${i.name}: ${fmt(i.need)} ${i.unit}`).join('\n');
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast('Η λίστα αντιγράφηκε')}catch(e){toast('Δεν ήταν δυνατή η αντιγραφή')}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':ui.tab=v;render();break;
    case 'filter':ui.f=v;render();break;
    case 'detail':detailSheet(id);break;
    case 'out':{const it=item(id);
      if(COUNT_UNITS.includes(it.unit)){if(stockOf(id)<=0)toast('Δεν υπάρχει απόθεμα');else addTx(id,'out',1)}
      else qtySheet(id,'out',1);break}
    case 'outq':qtySheet(id,'out',1);break;
    case 'in':qtySheet(id,'in',1);break;
    case 'buy':qtySheet(id,'in',shopItems().find(i=>i.id===id).need);break;
    case 'new':itemSheet(null);break;
    case 'edit':itemSheet(id);break;
    case 'saveitem':saveItem(id||null);break;
    case 'saveqty':saveQty(id,v);break;
    case 'delitem':if(confirm('Διαγραφή του είδους και όλου του ιστορικού του;')){S.items=S.items.filter(i=>i.id!==id);S.tx=S.tx.filter(t=>t.itemId!==id);save();closeSheet();render()}break;
    case 'deltx':if(confirm('Διαγραφή αυτής της κίνησης;')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}break;
    case 'close':closeSheet();break;
    case 'sharelist':shareList();break;
    case 'export':doExport();break;
    case 'import':$('#file').click();break;
    case 'addcat':{const f=$('#newcat'),c=f.value.trim();if(!c)return;if(S.cats.includes(c))return toast('Υπάρχει ήδη');S.cats.push(c);save();render();break}
    case 'delcat':S.cats=S.cats.filter(c=>c!==v);save();render();break;
    case 'starter':{let n=0;
      STARTER.forEach(([name,cat,unit,min])=>{
        if(S.items.some(i=>i.name.toLowerCase()===name.toLowerCase()))return;
        if(!S.cats.includes(cat))S.cats.push(cat);
        S.items.push({id:uid(),name,cat,unit,min,barcode:''});n++;
      });
      save();render();toast(n?`Προστέθηκαν ${n} είδη`:'Όλα τα βασικά είδη υπάρχουν ήδη');break}
    case 'wipe':if(confirm('ΠΡΟΣΟΧΗ: θα διαγραφούν όλα τα είδη και οι κινήσεις. Να συνεχίσω;')){S=blank();save();render();toast('Τα δεδομένα διαγράφηκαν')}break;
  }
});
$('#sheetwrap').addEventListener('click',e=>{if(e.target===$('#sheetwrap'))closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;$('#list').innerHTML=listStock()}});
document.addEventListener('change',e=>{
  if(e.target.id==='catsel'){ui.cat=e.target.value;$('#list').innerHTML=listStock()}
  if(e.target.id==='f_cat'){const n=$('#f_newcat');n.style.display=e.target.value==='__new'?'block':'none';if(e.target.value==='__new')n.focus()}
  if(e.target.id==='file'){
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.items)||!Array.isArray(d.tx))throw 0;
        if(!confirm('Τα τρέχοντα δεδομένα θα αντικατασταθούν από το αντίγραφο. Να συνεχίσω;'))return;
        d.cats=Array.isArray(d.cats)&&d.cats.length?d.cats:[...DEFAULT_CATS];
        S=d;save();render();toast('Η εισαγωγή ολοκληρώθηκε');
      }catch(err){toast('Μη έγκυρο αρχείο αντιγράφου')}
      e.target.value='';
    };
    r.readAsText(f);
  }
});

render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
