<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Grocery">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Smart Grocery</title>
<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#1b2420;--mut:#6b7872;--pri:#1f7a5c;--pri-t:#fff;--line:#e3e7e4;--red:#c0392b;--amb:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#111815;--card:#1a2420;--tx:#eaf0ed;--mut:#93a39b;--pri:#34a77f;--pri-t:#06130e;--line:#26332d;--red:#ef6a5b;--amb:#e0a73a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--pri);color:var(--pri-t);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:18px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px}
#sync{font-size:12px;font-weight:400;opacity:.92;white-space:nowrap}
main{padding:12px 12px 150px;max-width:640px;margin:0 auto}
h4{margin:18px 4px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.tools{display:flex;gap:8px;margin-bottom:8px}
.tools input{flex:1.4;min-width:0}.tools select{flex:1;min-width:0}
input,select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}
label input,label select{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chip.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.info{flex:1;min-width:0}.info b{display:block;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mut);font-size:14px}
.bl{display:block;font-size:12px;line-height:1.35;color:var(--mut)}
.bl.low{color:var(--amb)}.bl.out{color:var(--red)}
.btns{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:24px;line-height:1}
.rb.add{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.b{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:4px}
.b.out{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.b.low{background:color-mix(in srgb,var(--amb) 20%,transparent);color:var(--amb)}
.q{font-weight:700;white-space:nowrap}.q.in{color:var(--pri)}.q.out{color:var(--red)}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:8px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav .i{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-style:normal;border-radius:999px;padding:0 6px;min-width:16px}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-t);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:6}
#sheetwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
#sheetwrap.open{display:flex}
.card{background:var(--card);width:100%;max-width:640px;border-radius:18px;padding:18px 16px;max-height:85vh;max-height:85dvh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card h3{margin:0 0 6px}
.big{font-size:34px;font-weight:700}.big span{font-size:16px;font-weight:400;color:var(--mut)}
.meta{color:var(--mut);font-size:14px;margin:4px 0 8px}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button,.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-weight:600}
.actions .primary,.btn.primary{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.actions .danger,.btn.danger{color:var(--red)}
.btn{display:block;width:100%;margin-top:8px}
.btn[disabled]{opacity:.55}
.hl{font-size:14px;color:var(--mut);padding:3px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}
.catrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 14px;margin-bottom:6px;gap:8px}
.catrow span:first-child{overflow:hidden;text-overflow:ellipsis}
.msg{margin:12px 2px 0;font-size:14px;color:var(--pri)}.msg.err{color:var(--red)}
.link{background:none;border:0;color:var(--pri);font:inherit;font-size:14px;padding:10px;display:block;margin:6px auto 0}
.setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;font-size:15px}
.setup code{background:var(--bg);padding:1px 6px;border-radius:6px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;gap:10px;z-index:20}
#toast.show{display:flex}
#toast button{background:none;border:0;color:#7ee0b8;font:inherit;font-weight:700}
</style>
</head>
<body>
<header><span>🛒 Smart Grocery</span><span id="sync"></span></header>
<main id="main"></main>
<button id="fab" data-act="new" aria-label="Νέο είδος" style="display:none">+</button>
<nav style="display:none">
  <button data-act="tab" data-v="stock"><span class="i">📦</span>Απόθεμα</button>
  <button data-act="tab" data-v="items"><span class="i">🗂️</span>Είδη</button>
  <button data-act="tab" data-v="shop"><span class="i">📝</span>Ψώνια<i class="dot" id="dot" style="display:none"></i></button>
  <button data-act="tab" data-v="hist"><span class="i">🕘</span>Ιστορικό</button>
  <button data-act="tab" data-v="set"><span class="i">⚙️</span>Ρυθμίσεις</button>
</nav>
<div id="sheetwrap"><div id="sheet" style="width:100%;display:flex;justify-content:center"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const DEFAULT_CATS=['Χαρτικά','Απορρυπαντικά','Προσωπική υγιεινή','Γαλακτοκομικά','Σνακ','Ξηρά τρόφιμα','Κατεψυγμένα','Φρούτα & Λαχανικά','Ποτά','Άλλο'];
const UNITS=['τεμ.','πακέτο','συσκ.','ρολά','kg','gr','lt','ml'];
const COUNT_UNITS=['τεμ.','πακέτο','συσκ.','ρολά'];
const EXP_DAYS=7;
const LEGACY_KEY='apothiki_v1';
const STARTER=[
['Χαρτί υγείας','Χαρτικά','ρολά',8],['Χαρτί κουζίνας','Χαρτικά','ρολά',2],['Χαρτομάντιλα','Χαρτικά','πακέτο',2],
['Απορρυπαντικό πλυντηρίου ρούχων','Απορρυπαντικά','συσκ.',1],['Μαλακτικό','Απορρυπαντικά','συσκ.',1],['Υγρό πιάτων','Απορρυπαντικά','τεμ.',1],
['Ταμπλέτες πλυντηρίου πιάτων','Απορρυπαντικά','συσκ.',1],['Χλωρίνη','Απορρυπαντικά','τεμ.',1],['Καθαριστικό τζαμιών','Απορρυπαντικά','τεμ.',1],
['Σαμπουάν','Προσωπική υγιεινή','τεμ.',1],['Αφρόλουτρο','Προσωπική υγιεινή','τεμ.',1],['Οδοντόκρεμα','Προσωπική υγιεινή','τεμ.',1],['Σαπούνι','Προσωπική υγιεινή','τεμ.',2],
['Γάλα','Γαλακτοκομικά','τεμ.',2],['Γιαούρτι','Γαλακτοκομικά','τεμ.',4],['Τυρί σε φέτες','Γαλακτοκομικά','πακέτο',1],['Βούτυρο','Γαλακτοκομικά','τεμ.',1],['Αυγά','Γαλακτοκομικά','πακέτο',1],
['Μπισκότα','Σνακ','πακέτο',2],['Πατατάκια','Σνακ','πακέτο',1],['Μπάρες δημητριακών','Σνακ','πακέτο',1],['Ξηροί καρποί','Σνακ','πακέτο',1],
['Ρύζι','Ξηρά τρόφιμα','kg',1],['Μακαρόνια','Ξηρά τρόφιμα','πακέτο',3],['Αλεύρι','Ξηρά τρόφιμα','kg',1],['Ζάχαρη','Ξηρά τρόφιμα','kg',1],['Καφές','Ξηρά τρόφιμα','πακέτο',1],['Ελαιόλαδο','Ξηρά τρόφιμα','lt',1],['Τόνος κονσέρβα','Ξηρά τρόφιμα','τεμ.',2]
];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const parseNum=v=>parseFloat(String(v).replace(',','.'));
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16));b[6]=b[6]&15|64;b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
const localISO=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(localISO()+'T00:00:00'))/864e5);
const fmtDate=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const fmtDT=s=>new Date(s).toLocaleString('el-GR',{dateStyle:'short',timeStyle:'short'});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function lsPut(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const jparse=s=>{try{return JSON.parse(s)}catch(e){return null}};

/* ---------- Κατάσταση ---------- */
function blank(){return{items:[],tx:[],cats:[...DEFAULT_CATS]}}
const CFG=window.SG_CONFIG||{};
const configured=!!(CFG.SUPABASE_URL&&/^https:\/\/.+/.test(CFG.SUPABASE_URL)&&CFG.SUPABASE_ANON_KEY&&String(CFG.SUPABASE_ANON_KEY).length>40);
const APP_URL=location.origin+location.pathname;
let S=blank(),user=null,queue=[],sb=null,chan=null;
let flushing=false,pulling=false,pullPending=false,pullTimer=null,retryTimer=null,syncErr=false,localVer=0;
const mine=new Set();
const ui={screen:'loading',tab:'stock',hf:'all',q:'',f:'all',cat:'',authMode:'login',authEmail:''};
const item=id=>S.items.find(i=>i.id===id);

function persist(){
  if(!user)return;
  const a=lsPut('sg_data_'+user.id,JSON.stringify(S)),b=lsPut('sg_queue_'+user.id,JSON.stringify(queue));
  if(!a||!b)toast('Αποτυχία τοπικής αποθήκευσης');
}
const save=persist;
function loadLocal(uid){
  const d=jparse(lsGet('sg_data_'+uid));
  S=(d&&Array.isArray(d.items)&&Array.isArray(d.tx))?d:blank();
  if(!Array.isArray(S.cats)||!S.cats.length)S.cats=[...DEFAULT_CATS];
  const q=jparse(lsGet('sg_queue_'+uid));
  queue=Array.isArray(q)?q:[];
}

/* ---------- Αντιστοίχιση με τη βάση ---------- */
const itemRow=i=>({id:i.id,user_id:user.id,name:i.name,cat:i.cat,unit:i.unit,min_qty:i.min||0,barcode:i.barcode||''});
const txRow=t=>({id:t.id,user_id:user.id,item_id:t.itemId,type:t.type,qty:t.qty,expiry:t.expiry||null,created_at:t.date});
const fromItem=r=>({id:r.id,name:r.name,cat:r.cat,unit:r.unit,min:Number(r.min_qty)||0,barcode:r.barcode||''});
function fromTx(r){const t={id:r.id,itemId:r.item_id,type:r.type,qty:Number(r.qty),date:new Date(r.created_at).toISOString()};if(r.expiry)t.expiry=r.expiry;return t}

function markMine(id){mine.add(id);setTimeout(()=>mine.delete(id),20000)}
function enqueue(table,op,payload,key){
  queue.push({table,op,payload});localVer++;
  if(key)markMine(key);
  persist();updateSync();flush();
}
const pushItem=i=>enqueue('items','upsert',itemRow(i),i.id);
const pushTx=t=>enqueue('tx','upsert',txRow(t),t.id);
const delItemRemote=id=>{S.tx.filter(t=>t.itemId===id).forEach(t=>markMine(t.id));enqueue('items','delete',{id},id)};
const delTxRemote=id=>enqueue('tx','delete',{id},id);
const pushCats=()=>enqueue('settings','upsert',{user_id:user.id,cats:S.cats},user.id);

/* ---------- Συγχρονισμός ---------- */
function permanent(r){const s=r.status;return s>=400&&s<500&&![401,408,429].includes(s)}
async function flush(){
  if(!sb||!user||user.offline||flushing||!navigator.onLine)return;
  flushing=true;updateSync();
  let dropped=false;
  try{
    while(queue.length){
      const op=queue[0];
      let r;
      if(op.op==='upsert')r=await sb.from(op.table).upsert(op.payload,op.table==='settings'?{onConflict:'user_id'}:undefined);
      else r=await sb.from(op.table).delete().eq('id',op.payload.id);
      if(r.error){
        if(permanent(r)){queue.shift();persist();dropped=true;continue}
        throw r.error;
      }
      queue.shift();persist();
    }
    syncErr=false;
  }catch(e){
    syncErr=true;
    clearTimeout(retryTimer);retryTimer=setTimeout(flush,15000);
  }finally{flushing=false;updateSync()}
  if(dropped){toast('Κάποια αλλαγή δεν μπόρεσε να αποθηκευτεί και ακυρώθηκε');pullPending=true}
  if(!queue.length&&pullPending){pullPending=false;pull()}
}
async function fetchAll(table){
  let all=[],from=0;const step=1000;
  for(;;){
    const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:true}).order('id',{ascending:true}).range(from,from+step-1);
    if(error)throw error;
    all=all.concat(data);
    if(data.length<step)break;
    from+=step;
  }
  return all;
}
async function pull(){
  if(!sb||!user||user.offline||!navigator.onLine)return;
  if(pulling)return;
  if(queue.length||flushing){pullPending=true;return}
  pulling=true;const ver=localVer;
  try{
    const [it,tx,st]=await Promise.all([fetchAll('items'),fetchAll('tx'),sb.from('settings').select('*').maybeSingle()]);
    if(st.error)throw st.error;
    if(queue.length||flushing||ver!==localVer){pullPending=true;return}
    S.items=it.map(fromItem);
    S.tx=tx.map(fromTx);
    if(st.data&&Array.isArray(st.data.cats)&&st.data.cats.length)S.cats=st.data.cats;
    persist();syncErr=false;refresh();
    if(!st.data)pushCats();
  }catch(e){syncErr=true}
  finally{pulling=false;updateSync()}
}
function schedulePull(){clearTimeout(pullTimer);pullTimer=setTimeout(pull,500)}
function subscribe(){
  unsubscribe();
  try{
    chan=sb.channel('sg-'+user.id);
    ['items','tx','settings'].forEach(t=>chan.on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
      const id=(p.new&&(p.new.id||p.new.user_id))||(p.old&&(p.old.id||p.old.user_id));
      if(id&&mine.has(id))return;
      schedulePull();
    }));
    chan.subscribe();
  }catch(e){}
}
function unsubscribe(){try{if(chan&&sb)sb.removeChannel(chan)}catch(e){}chan=null}

function syncLabel(){
  if(!user)return '';
  const n=queue.length?' · '+queue.length+' εκκρεμούν':'';
  if(!navigator.onLine||user.offline)return '📴 Εκτός σύνδεσης'+n;
  if(syncErr)return '⚠️ Δεν συγχρονίστηκε'+n;
  if(queue.length||flushing)return '🔄 Συγχρονισμός…';
  return '☁️ Συγχρονισμένο';
}
function updateSync(){
  const e=$('#sync');if(e)e.textContent=(user&&ui.screen==='app')?syncLabel():'';
  const s=$('#syncset');if(s)s.textContent=syncLabel();
}

/* ---------- Σύνδεση / λογαριασμός ---------- */
function trErr(e){
  const m=String((e&&e.message)||e);
  if(/Invalid login credentials/i.test(m))return 'Λάθος email ή κωδικός';
  if(/already registered|already exists/i.test(m))return 'Υπάρχει ήδη λογαριασμός με αυτό το email';
  if(/not confirmed/i.test(m))return 'Το email δεν έχει επιβεβαιωθεί. Έλεγξε τα εισερχόμενά σου.';
  if(/at least \d+ char/i.test(m))return 'Ο κωδικός είναι πολύ μικρός';
  if(/rate limit|too many|security purposes/i.test(m))return 'Πολλές προσπάθειες. Δοκίμασε ξανά σε λίγο.';
  if(/valid email|invalid.*email/i.test(m))return 'Μη έγκυρο email';
  if(/fetch|network/i.test(m))return 'Δεν υπάρχει σύνδεση με το internet';
  return 'Κάτι πήγε στραβά: '+m;
}
function setAuthMsg(t,err){const e=$('#amsg');if(e){e.textContent=t||'';e.className='msg'+(err?' err':'')}}
function setBusy(b){const e=$('#authgo');if(e)e.disabled=b}
async function authGo(){
  const email=($('#a_email').value||'').trim(),pass=$('#a_pass').value||'';
  ui.authEmail=email;
  const reg=ui.authMode==='register';
  if(!email||!pass)return setAuthMsg('Γράψε email και κωδικό',true);
  if(reg&&pass.length<8)return setAuthMsg('Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες',true);
  if(!sb)return setAuthMsg('Δεν υπάρχει σύνδεση με τον διακομιστή. Έλεγξε το internet και ξανάνοιξε την εφαρμογή.',true);
  setBusy(true);setAuthMsg('');
  try{
    if(reg){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:APP_URL}});
      if(error)throw error;
      if(data.session)await onSession(data.session);
      else{ui.authMode='login';render();$('#a_email').value=email;setAuthMsg('Σου στείλαμε email επιβεβαίωσης. Πάτα τον σύνδεσμο και μετά κάνε σύνδεση.')}
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
      if(data.session)await onSession(data.session);
    }
  }catch(e){setAuthMsg(trErr(e),true)}
  finally{setBusy(false)}
}
async function forgot(){
  const email=($('#a_email').value||'').trim();
  if(!email)return setAuthMsg('Γράψε πρώτα το email σου',true);
  if(!sb)return setAuthMsg('Δεν υπάρχει σύνδεση με τον διακομιστή',true);
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});
    if(error)throw error;
    setAuthMsg('Αν υπάρχει λογαριασμός, στάλθηκε email με οδηγίες.');
  }catch(e){setAuthMsg(trErr(e),true)}
}
async function onSession(session){
  if(user&&user.id===session.user.id&&!user.offline)return;
  user={id:session.user.id,email:session.user.email,offline:false};
  lsPut('sg_last_user',JSON.stringify({id:user.id,email:user.email}));
  loadLocal(user.id);
  ui.screen='app';render(true);
  subscribe();
  await flush();
  await pull();
  checkLegacy();
}
function goOffline(last){
  user={id:last.id,email:last.email,offline:true};
  loadLocal(user.id);ui.screen='app';render(true);
}
async function doSignOut(){
  if(queue.length&&!confirm('Υπάρχουν αλλαγές που δεν έχουν συγχρονιστεί και θα χαθούν. Να συνεχίσω;'))return;
  const uid=user.id;
  unsubscribe();
  lsDel('sg_data_'+uid);lsDel('sg_queue_'+uid);lsDel('sg_last_user');
  user=null;S=blank();queue=[];
  try{if(sb)await sb.auth.signOut()}catch(e){}
  ui.screen='auth';ui.tab='stock';render(true);
}
function sessionLost(){
  unsubscribe();user=null;S=blank();queue=[];ui.screen='auth';render(true);
}
async function boot(){
  if(!configured){ui.screen='setup';render(true);return}
  if(window.supabase){
    sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sb.auth.onAuthStateChange((ev,session)=>{
      setTimeout(()=>{
        if(ev==='PASSWORD_RECOVERY'&&session){onSession(session).then(newPassSheet);return}
        if(session&&(!user||user.id!==session.user.id||user.offline))onSession(session);
        else if(!session&&user&&!user.offline&&ev==='SIGNED_OUT')sessionLost();
      },0);
    });
  }
  let session=null,err=null;
  if(sb){try{const r=await sb.auth.getSession();session=r.data.session;err=r.error}catch(e){err=e}}
  if(session){await onSession(session);return}
  const last=jparse(lsGet('sg_last_user'));
  if(last&&last.id&&(!sb||!navigator.onLine||err)){goOffline(last);return}
  ui.screen='auth';render(true);
}

function importData(d){
  const map={};let ni=0,nt=0;
  const existing=new Map(S.items.map(i=>[i.name.toLowerCase(),i]));
  (d.items||[]).forEach(o=>{
    const name=String((o&&o.name)||'').trim();if(!name)return;
    let it=existing.get(name.toLowerCase());
    if(!it){
      it={id:newId(),name,cat:o.cat||'Άλλο',unit:o.unit||'τεμ.',min:Number(o.min)||0,barcode:o.barcode||''};
      S.items.push(it);existing.set(name.toLowerCase(),it);pushItem(it);ni++;
    }
    map[o.id]=it.id;
  });
  (d.tx||[]).forEach(t=>{
    const iid=map[t.itemId];const q=Number(t.qty);
    if(!iid||!(q>0))return;
    const x={id:newId(),itemId:iid,type:t.type==='out'?'out':'in',qty:q,date:isNaN(Date.parse(t.date))?new Date().toISOString():new Date(t.date).toISOString()};
    if(t.expiry&&/^\d{4}-\d{2}-\d{2}$/.test(t.expiry))x.expiry=t.expiry;
    S.tx.push(x);pushTx(x);nt++;
  });
  let catsChanged=false;
  (d.cats||[]).forEach(c=>{if(typeof c==='string'&&c&&!S.cats.includes(c)){S.cats.push(c);catsChanged=true}});
  S.items.forEach(i=>{if(!S.cats.includes(i.cat)){S.cats.push(i.cat);catsChanged=true}});
  if(catsChanged)pushCats();
  persist();render();
  return{ni,nt};
}

/* ---------- Υπολογισμοί ---------- */
function stockOf(id){let s=0;for(const t of S.tx)if(t.itemId===id)s+=t.type==='in'?t.qty:-t.qty;return Math.round(s*1000)/1000}
function nextExpiry(id){
  const ins=S.tx.filter(t=>t.itemId===id&&t.type==='in').map(t=>({q:t.qty,e:t.expiry||''}));
  let out=S.tx.filter(t=>t.itemId===id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
  ins.sort((a,b)=>{const x=a.e||'9999',y=b.e||'9999';return x<y?-1:x>y?1:0});
  for(const b of ins){const u=Math.min(b.q,out);b.q-=u;out-=u}
  const left=ins.filter(b=>b.q>0.001&&b.e);
  return left.length?left[0].e:null;
}
// Υπόλοιπο ανά ημερομηνία λήξης: οι καταναλώσεις αφαιρούνται πρώτα από όσα λήγουν νωρίτερα.
function batches(id){
  const ins=S.tx.filter(t=>t.itemId===id&&t.type==='in').map(t=>({q:t.qty,e:t.expiry||''}));
  let out=S.tx.filter(t=>t.itemId===id&&t.type==='out').reduce((a,t)=>a+t.qty,0);
  ins.sort((a,b)=>{const x=a.e||'9999',y=b.e||'9999';return x<y?-1:x>y?1:0});
  for(const b of ins){const u=Math.min(b.q,out);b.q-=u;out-=u}
  const m=new Map();
  ins.forEach(b=>{if(b.q>0.001)m.set(b.e,(m.get(b.e)||0)+b.q)});
  return [...m].map(([e,q])=>({e,q})).sort((a,b)=>{const x=a.e||'9999',y=b.e||'9999';return x<y?-1:x>y?1:0});
}
function batchLines(i){
  if(!i.bt||!i.bt.some(b=>b.e))return '';
  return i.bt.map(b=>{
    const d=b.e?daysTo(b.e):null;
    const cls=d===null?'':d<0?'out':d<=EXP_DAYS?'low':'';
    return `<span class="bl ${cls}">${b.e?'λήξη '+fmtDate(b.e):'χωρίς λήξη'} · ${fmt(b.q)} ${esc(i.unit)}</span>`;
  }).join('');
}
function info(i){
  const st=stockOf(i.id),ex=st>0?nextExpiry(i.id):null,d=ex?daysTo(ex):null;
  return Object.assign({},i,{st,ex,d,bt:st>0?batches(i.id):[],low:i.min>0&&st<=i.min,soon:d!==null&&d<=EXP_DAYS});
}
function shopItems(){
  return S.items.map(info).filter(i=>i.min>0&&i.st<=i.min).map(i=>{
    let need=i.min*2-i.st;need=COUNT_UNITS.includes(i.unit)?Math.ceil(need):Math.round(need*100)/100;
    return Object.assign(i,{need});
  });
}

function render(top){

  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab));
  $('nav').style.display=app?'flex':'none';
  $('#fab').style.display=(app&&(ui.tab==='stock'||ui.tab==='items'))?'flex':'none';
  if(app)updateDot();
  updateSync();
  if(top)window.scrollTo(0,0);
}
function refresh(){
  if(ui.screen!=='app')return;
  const ae=document.activeElement;
  if((ui.tab==='stock'||ui.tab==='items')&&$('#list')){$('#list').innerHTML=listStock();updateDot()}
  else if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')){updateDot()}
  else render();
  updateSync();
}

let tt;
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button id="undo">Αναίρεση</button>':'');
  t.classList.add('show');
  if(undo)$('#undo').onclick=()=>{undo();hideToast()};
  clearTimeout(tt);tt=setTimeout(hideToast,undo?5000:2500);
}
function hideToast(){$('#toast').classList.remove('show')}

function saveItem(id){
  const name=$('#f_name').value.trim();
  if(!name)return toast('Γράψε όνομα');
  let cat=$('#f_cat').value,catAdded=false;
  if(cat==='__new'){cat=$('#f_newcat').value.trim();if(!cat)return toast('Γράψε όνομα κατηγορίας');if(!S.cats.includes(cat)){S.cats.push(cat);catAdded=true}}
  if(S.items.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))return toast('Υπάρχει ήδη είδος με αυτό το όνομα');
  const unit=$('#f_unit').value,min=parseNum($('#f_min').value)||0,barcode=$('#f_bar').value.trim();
  if(catAdded)pushCats();
  if(id){const it=item(id);Object.assign(it,{name,cat,unit,min,barcode});pushItem(it);closeSheet();render();toast('Αποθηκεύτηκε');return}
  const it={id:newId(),name,cat,unit,min,barcode};
  S.items.push(it);pushItem(it);
  const q=parseNum($('#f_qty').value),ex=$('#f_exp').value;
  closeSheet();
  if(q>0)addTx(it.id,'in',q,ex);else{render();toast('Το είδος προστέθηκε')}
}
function saveQty(id,type){
  let q=parseNum($('#f_qty').value);
  if(!(q>0))return toast('Βάλε ποσότητα μεγαλύτερη από 0');
  if(type==='out'){
    const st=stockOf(id);
    if(st<=0)return toast('Δεν υπάρχει απόθεμα');
    if(q>st){q=st;toast('Το απόθεμα ήταν '+fmt(st)+' — καταχωρήθηκε αυτή η ποσότητα')}
  }
  const ex=type==='in'?$('#f_exp').value:'';
  closeSheet();addTx(id,type,q,ex);
}
async function doExport(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const name='smart-grocery-'+localISO()+'.json';
  try{
    const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Αντίγραφο Smart Grocery'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
async function shareList(){
  const txt='Λίστα αγορών\n'+shopItems().map(i=>`- ${i.name}: ${fmt(i.need)} ${i.unit}`).join('\n');
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast('Η λίστα αντιγράφηκε')}catch(e){toast('Δεν ήταν δυνατή η αντιγραφή')}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':ui.tab=v;ui.f='all';render(true);break;
    case 'filter':ui.f=v;render();break;
    case 'hfilter':ui.hf=v;render();break;
    case 'detail':detailSheet(id);break;
    case 'out':{const it=item(id);
      if(COUNT_UNITS.includes(it.unit)){if(stockOf(id)<=0)toast('Δεν υπάρχει απόθεμα');else addTx(id,'out',1)}
      else qtySheet(id,'out',1);break}
    case 'outq':qtySheet(id,'out',1);break;
    case 'in':qtySheet(id,'in',1);break;
    case 'buy':qtySheet(id,'in',shopItems().find(i=>i.id===id).need);break;
    case 'new':itemSheet(null);break;
    case 'edit':itemSheet(id);break;
    case 'saveitem':saveItem(id||null);break;
    case 'saveqty':saveQty(id,v);break;
    case 'delitem':if(confirm('Διαγραφή του είδους και όλου του ιστορικού του;')){delItemRemote(id);S.items=S.items.filter(i=>i.id!==id);S.tx=S.tx.filter(t=>t.itemId!==id);persist();closeSheet();render()}break;
    case 'deltx':if(confirm('Διαγραφή αυτής της κίνησης;')){S.tx=S.tx.filter(t=>t.id!==id);delTxRemote(id);render()}break;
    case 'close':closeSheet();break;
    case 'sharelist':shareList();break;
    case 'export':doExport();break;
    case 'import':$('#file').click();break;
    case 'addcat':{const f=$('#newcat'),c=f.value.trim();if(!c)return;if(S.cats.includes(c))return toast('Υπάρχει ήδη');S.cats.push(c);pushCats();render();break}
    case 'delcat':S.cats=S.cats.filter(c=>c!==v);pushCats();render();break;
    case 'starter':{let n=0,catAdded=false;
      STARTER.forEach(([name,cat,unit,min])=>{
        if(S.items.some(i=>i.name.toLowerCase()===name.toLowerCase()))return;
        if(!S.cats.includes(cat)){S.cats.push(cat);catAdded=true}
        const it={id:newId(),name,cat,unit,min,barcode:''};
        S.items.push(it);pushItem(it);n++;
      });
      if(catAdded)pushCats();
      render();toast(n?`Προστέθηκαν ${n} είδη`:'Όλα τα βασικά είδη υπάρχουν ήδη');break}
    case 'wipe':if(confirm('ΠΡΟΣΟΧΗ: θα διαγραφούν όλα τα είδη και οι κινήσεις από όλες τις συσκευές. Να συνεχίσω;')){
      S.items.forEach(i=>delItemRemote(i.id));S.items=[];S.tx=[];persist();render();toast('Τα δεδομένα διαγράφηκαν')}break;
    case 'authgo':authGo();break;
    case 'authmode':ui.authEmail=($('#a_email')||{}).value||ui.authEmail;ui.authMode=ui.authMode==='login'?'register':'login';render();break;
    case 'forgot':forgot();break;
    case 'signout':doSignOut();break;
    case 'syncnow':if(!navigator.onLine)toast('Δεν υπάρχει σύνδεση με το internet');else{toast('Συγχρονισμός…');flush().then(()=>{pullPending=false;pull()})}break;
    case 'legacyyes':{const d=jparse(lsGet(LEGACY_KEY));lsPut('sg_legacy_done_'+user.id,'1');closeSheet();if(d){const r=importData(d);toast(`Μεταφέρθηκαν ${r.ni} είδη και ${r.nt} κινήσεις`)}break}
    case 'legacyno':lsPut('sg_legacy_done_'+user.id,'1');closeSheet();break;
    case 'savepass':{const p=($('#np').value||'');if(p.length<8)return toast('Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες');
      sb.auth.updateUser({password:p}).then(r=>{if(r.error)toast(trErr(r.error));else{closeSheet();toast('Ο κωδικός άλλαξε')}});break}
  }
});
$('#sheetwrap').addEventListener('click',e=>{if(e.target===$('#sheetwrap'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='a_pass')authGo()});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;$('#list').innerHTML=listStock()}});
document.addEventListener('change',e=>{
  if(e.target.id==='catsel'){ui.cat=e.target.value;$('#list').innerHTML=listStock()}
  if(e.target.id==='f_cat'){const n=$('#f_newcat');n.style.display=e.target.value==='__new'?'block':'none';if(e.target.value==='__new')n.focus()}
  if(e.target.id==='file'){
    const f=e.target.files[0],inp=e.target;if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.items)||!Array.isArray(d.tx))throw 0;
        if(!confirm('Τα δεδομένα του αντιγράφου θα προστεθούν στα υπάρχοντα. Να συνεχίσω;'))return;
        const res=importData(d);toast(`Προστέθηκαν ${res.ni} είδη και ${res.nt} κινήσεις`);
      }catch(err){toast('Μη έγκυρο αρχείο αντιγράφου')}
      inp.value='';
    };
    r.readAsText(f);
  }
});
window.addEventListener('online',async()=>{
  updateSync();
  if(!sb||!user)return;
  if(user.offline){try{const r=await sb.auth.getSession();if(r.data.session)await onSession(r.data.session)}catch(e){}}
  else{await flush();pull()}
});
window.addEventListener('offline',updateSync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user&&!user.offline){flush().then(pull)}});

render(true);
boot();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
